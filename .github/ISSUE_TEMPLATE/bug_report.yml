name: Bug report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To reproduce
      description: Steps to reproduce the behaviour.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node/Python versions, deployment (local / PM2 / CI).
  - type: textarea
    id: logs
    attributes:
      label: Screenshots / logs
      description: Add screenshots or the console/PM2 logs.
